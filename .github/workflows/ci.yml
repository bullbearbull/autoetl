name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 린트와 타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: 의존성 설치
        run: uv sync --frozen
      - name: ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: mypy
        run: uv run --frozen mypy

  test:
    name: 테스트 ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 보류(비용, 2026-11-06 소유자 결정) — macOS 러너는 Linux의 약 10배
        # 요금이라 비공개 저장소 CI 비용의 대부분을 차지한다. 공개하거나 소유자가
        # 다시 켜라고 하면 os 목록에 macos-latest를 되돌린다.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: 의존성 설치
        run: uv sync --frozen --python "${{ matrix.python }}"
      - name: pytest
        run: uv run --frozen pytest

  license:
    name: 의존성 라이선스 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: 의존성 설치
        run: uv sync --frozen
      - name: 라이선스 검사
        run: uv run --frozen python tools/license_check.py
